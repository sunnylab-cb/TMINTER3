data:
  pair_manifest: features/contact_labels_pairwise_5p5A_20261001/pair_manifest.csv
  pair_label_root: features/contact_labels_pairwise_5p5A_20261001
  esm_root: features/esm2_mlc_chain_cache_20260711/compact_pdb
  primary_embedding_root: features/esmc_600m_2024_12_mlc_l12_l24_l36/by_chain
  contact_graph_root: features/esm2_mlc_chain_cache_20260711/by_chain
  sequence_feature_root: features/esmfold_pred_struct_sequence_scalar_chain_filtered/pt
  chain_filter_manifest: features/contact_labels_5p5A/splits_pairwise_global_si30_deeptminter_tmk_no_len_limit_20260708/pypropel_chain_filtered_no_len_limit/chain_manifest.csv
  require_sequence_features: true
  require_primary_embeddings: true
  require_contact_graph: true
model:
  d_esm: 3456
  d_seq: 90
  d_model: 256
  d_hidden: 512
  dropout: 0.25
  classifier_dropout: 0.45
  max_chains: 128
  use_chain_embedding: true
  use_seq_features: true
  use_position_features: true
  use_global_context: true
  use_contact_graph: true
  contact_graph_layers: 1
  contact_score_clip: 1.0
  n_transformer_layers: 0
  esm_layer_fusion: concat
  esm_layer_count: 3
  use_tcn_context: true
  tcn_layers: 2
  tcn_kernel_size: 7
  tcn_dilations:
  - 1
  - 2
  tcn_block_type: gated_depthwise
pair_model:
  mode: outer_product
  pair_rank: 8
  pair_hidden: 32
  bottleneck: 64
  dropout: 0.1
  conv_layers: 0
  pooling: softmax
  pooling_temperature: 0.5
training:
  output_dir: runs/pairwise_scratch_S3_consistency_seed49_20261002_hpc2
  device: cuda:0
  seed: 49
  epochs: 20
  batch_size: 64
  eval_batch_size: 64
  max_batch_tokens: 65536
  max_pair_cells: 1000000
  max_single_pair_cells: 6000000
  length_bucket_size: 512
  num_workers: 8
  pin_memory: true
  prefetch_factor: 4
  persistent_workers: true
  payload_cache_size: 8
  preload: false
  strict_sequence_feature_metadata: false
  base_lr: 0.0001
  pair_lr: 0.0001
  freeze_base_epochs: 0
  warmup_ratio: 0.05
  min_lr_scale: 0.02
  weight_decay: 0.1
  adam_eps: 1.0e-07
  label_smoothing: 0.05
  ratio_loss_weight: 0.25
  pair_contact_loss_weight: 0.2
  max_pos_weight: 20.0
  grad_clip_norm: 1.0
  amp: true
  evaluate_test: false
  initialization: scratch
  torch_num_threads: 4
  hard_negative_fraction: 0.0
  site_contact_consistency_weight: 0.05
metadata:
  task: known chain pair to bidirectional partner-specific residue interface labels
  label: 5.5 A heavy-atom contact to the specified partner
  split: frozen global DeepTMInter pairwise-SI30 component split
  architecture: S3_consistency
  matrix_variant: one-factor controlled scratch experiments
  initialization: random downstream parameters; fixed pretrained features; no checkpoint
  test_policy: hidden during training; one evaluation after validation checkpoint
    lock
